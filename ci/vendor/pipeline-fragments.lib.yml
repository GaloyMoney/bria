#@ def check_code():
name: check-code
serial: true
plan:
- in_parallel:
  - { get: repo, trigger: true }
  - { get: pipeline-tasks }
- task: check-code
  config:
    platform: linux
    image_resource: #@ nix_task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    caches:
    - path: /nix-cache
    - path: cargo-home/registry/index
    - path: cargo-home/registry/cache
    - path: cargo-target-dir
    run:
      path: pipeline-tasks/ci/vendor/tasks/with-nix-cache.sh
      args:
      - pipeline-tasks/ci/vendor/tasks/check-code.sh
#@ end

#@ def nodejs_check_code():
name: check-code
serial: true
plan:
- in_parallel:
  - { get: repo, trigger: true }
  - { get: pipeline-tasks }
  - { get: bundled-deps, trigger: true}
- task: check-code
  config:
    platform: linux
    image_resource: #@ nodejs_task_image_config()
    inputs:
    - name: bundled-deps
    - name: pipeline-tasks
    - name: repo
    run:
      path: pipeline-tasks/ci/vendor/tasks/nodejs-check-code.sh
#@ end

#@ def install_yarn_deps():
name: install-deps
plan:
- in_parallel:
  - {get: deps, trigger: true}
  - {get: pipeline-tasks}
  - {put: deps-version, params: {bump: patch}}
- task: install-deps
  config:
    platform: linux
    image_resource: #@ nodejs_task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: deps
    - name: deps-version
    outputs:
    - name: bundled-deps
    run:
      path: pipeline-tasks/ci/vendor/tasks/nodejs-cache-yarn-deps.sh
- put: bundled-deps
  params:
    file: bundled-deps/bundled-deps-*.tgz
#@ end

#@ def integration_test():
name: integration-test
plan:
  - in_parallel:
    - get: repo
      trigger: true
    - { get: pipeline-tasks }
  - task: integration-test
    attempts: 2
    privileged: true
    config:
      platform: linux
      image_resource: #@ nix_task_image_config()
      inputs:
        - name: pipeline-tasks
        - name: repo
      caches:
      - path: /nix-cache
      - path: cargo-home/registry/index
      - path: cargo-home/registry/cache
      - path: cargo-target-dir
      run:
        path: pipeline-tasks/ci/vendor/tasks/with-nix-cache.sh
        args:
        - pipeline-tasks/ci/vendor/tasks/test-integration.sh
#@ end

#@ def bats_test():
name: bats-test
plan:
- in_parallel:
  - get: repo
    trigger: true
  - get: pipeline-tasks
- task: bats-test
  privileged: true
  config:
    platform: linux
    image_resource: #@ nix_task_image_config()
    inputs:
    - name: pipeline-tasks
    - name: repo
    caches:
    - path: /nix-cache
    - path: cargo-home/registry/index
    - path: cargo-home/registry/cache
